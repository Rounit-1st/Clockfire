version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis-logs
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  scheduler:
    build: ./services/scheduler
    env_file: .env
    depends_on:
      - redis

  worker:
    build: ./services/worker
    env_file: .env
    depends_on:
      - redis

  api:
    build: ./services/api
    env_file: .env
    depends_on:
      - redis
